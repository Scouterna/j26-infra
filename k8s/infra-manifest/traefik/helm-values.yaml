deployment:
  replicas: 1

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
  kubernetesGateway:
    enabled: true

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

gatewayClass:
  enabled: true
  name: traefik

# Redirect HTTP → HTTPS globally
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

service:
  type: LoadBalancer
  # No annotation needed — AKS auto-assigns a static IP in its node resource group

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 256Mi

ingressRoute:
  dashboard:
    enabled: false

logs:
  general:
    level: WARN
  access:
    enabled: true

metrics:
  prometheus:
    # Per-router labels give per-IngressRoute breakdowns on the dashboard.
    addRoutersLabels: true
    # Finer latency buckets than the chart default (0.1/0.3/1.2/5s), so P50/P95/P99
    # are accurate instead of interpolated across wide gaps.
    buckets: "0.05,0.1,0.25,0.5,0.75,1,2.5,5"
    # Dedicated metrics Service + ServiceMonitor so kube-prometheus-stack scrapes us.
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      # Prometheus only selects ServiceMonitors carrying this release label.
      additionalLabels:
        release: kps

extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-traefik
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: hakan.persson@scouterna.se
        privateKeySecretRef:
          name: letsencrypt-traefik
        solvers:
          - http01:
              ingress:
                ingressClassName: traefik
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-traefik-staging
    spec:
      acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        email: hakan.persson@scouterna.se
        privateKeySecretRef:
          name: letsencrypt-traefik-staging
        solvers:
          - http01:
              ingress:
                ingressClassName: traefik
