grafana:

  # Soft-prefer the original 'agentpool' node pool (roomier RAM) so the memory-heavy
  # monitoring stack stays off the prod 'userpool' node. Preference only, so it still
  # schedules if agentpool is full. Both nodes share a zone, so the PVC alone doesn't pin it.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: agentpool
                operator: In
                values:
                  - agentpool

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - grafana.j26.se
    path: /
    tls:
      - secretName: grafana-j26-se-tls
        hosts:
          - grafana.j26.se

  grafana.ini:
    server:
      domain: grafana.j26.se
      root_url: https://grafana.j26.se

  persistence:
    enabled: true
    storageClassName: disk-standardssd
    size: 8Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    # Soft-prefer 'agentpool' — keep the memory-heavy monitoring stack off the prod node.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: agentpool
                  operator: In
                  values:
                    - agentpool
    retention: 90d
    retentionSize: 50GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: disk-standardssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 64Gi

alertmanager:
  alertmanagerSpec:
    # Soft-prefer 'agentpool' — keep the memory-heavy monitoring stack off the prod node.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: agentpool
                  operator: In
                  values:
                    - agentpool
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: disk-standardssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 4Gi
