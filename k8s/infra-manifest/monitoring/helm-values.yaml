grafana:

  # Soft-prefer the original 'agentpool' node pool (roomier RAM) so the memory-heavy
  # monitoring stack stays off the prod 'userpool' node. Preference only, so it still
  # schedules if agentpool is full. Both nodes share a zone, so the PVC alone doesn't pin it.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: agentpool
                operator: In
                values:
                  - agentpool

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
    hosts:
      - grafana.j26.se
    path: /
    tls:
      - secretName: grafana-j26-se-tls
        hosts:
          - grafana.j26.se

  grafana.ini:
    server:
      domain: grafana.j26.se
      root_url: https://grafana.j26.se

  persistence:
    enabled: true
    storageClassName: disk-standardssd
    size: 8Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        maxLines: 1000
    - name: Azure Monitor
      type: grafana-azure-monitor-datasource
      access: proxy
      editable: false
      jsonData:
        azureAuthType: clientsecret
        cloudName: azuremonitor
        tenantId: "317a47ba-fd32-41b8-8ebe-310a1adc9863"
        clientId: "f7ce7fad-4d2e-465a-8fed-6a09605dbcb3"
        subscriptionId: "97410996-3a4a-464b-8ba2-41b5dcda2d75"
      secureJsonData:
        clientSecret: "$AZURE_CLIENT_SECRET"

  envFromSecret: grafana-azure-monitor-secrets

  extraSecretMounts:
    - name: grafana-azure-monitor-kv-csi
      mountPath: /mnt/secrets-store
      readOnly: true
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: grafana-azure-monitor-kv-csi

prometheus:
  prometheusSpec:
    # Soft-prefer 'agentpool' — keep the memory-heavy monitoring stack off the prod node.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: agentpool
                  operator: In
                  values:
                    - agentpool
    retention: 90d
    # Size cap must stay below the PVC's usable disk (~67GB of the 64Gi request)
    # with headroom for WAL/head/compaction. Raised from 50GB (which was pruning
    # oldest data before 90d) so camp+evaluation data is retained by time, not size.
    retentionSize: 60GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: disk-standardssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 64Gi

alertmanager:
  alertmanagerSpec:
    # Soft-prefer 'agentpool' — keep the memory-heavy monitoring stack off the prod node.
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: agentpool
                  operator: In
                  values:
                    - agentpool
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: disk-standardssd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 4Gi
