# Prod: add the database DSN to the CSI-injected secret and read the prod copies of
# the Key Vault objects. Dev sources the database from an Azure Service Connector
# secret (sc-postgresqlfbac0-secret) and needs only the tags API key from KV; prod
# takes both from KV. The Kubernetes secret name (j26-interactive-screens-secrets) is
# unchanged, so the base Deployment's secretRef and this overlay's secretKeyRef stay
# valid. Both the secretObjects.data list and the parameters.objects array are
# restated in full (kustomize replaces these blocks); provider, vault name, tenant
# and identity are inherited from the base.
# NOTE: j26-prod-interactive-screens-postgres-dsn and j26-prod-tags-api-key must both
# exist in kv-j26apps-shared-sdc, and the prod database must be provisioned, before
# sync.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: j26-interactive-screens-kv-csi
spec:
  secretObjects:
    - secretName: j26-interactive-screens-secrets
      type: Opaque
      data:
        - key: DATABASE_URL
          objectName: j26-prod-interactive-screens-postgres-dsn
        - key: TAGS_API_KEY
          objectName: j26-prod-tags-api-key
  parameters:
    objects: |
      array:
        - |
          objectName: j26-prod-interactive-screens-postgres-dsn
          objectType: secret
        - |
          objectName: j26-prod-tags-api-key
          objectType: secret
