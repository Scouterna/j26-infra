apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay for j26-tags. References the dev package as a base and patches only
# what differs in prod: namespace, image tag, ingress (Traefik), the Keycloak
# discovery URL, and which Key Vault objects the SecretProviderClass reads.
#
# Note there is no deployment patch: dev and prod both source DATABASE_URL and
# TAGS_API_KEY from the same CSI-injected secret (j26-tags-secrets), so the base
# Deployment is already correct for prod. Only the KV object names behind it differ.
namespace: j26-prod

resources:
  - ../../app-manifest/j26-tags
  - ingressroute.yaml

# Pinned production image tag — bumped by an explicit commit, never by the
# image updater (see prod-apps/j26-tags.yaml).
# TODO: this tag does not exist yet. The build workflow only produces a semver tag
# when a GitHub release is published, so publish 1.0.0 in Scouterna/j26-tags before
# enabling the prod Application, or prod will fail to pull the image.
images:
  - name: ghcr.io/scouterna/j26-tags
    newTag: "1.0.0"

patches:
  # Replace the base nginx Ingress with a Traefik IngressRoute (see ingressroute.yaml).
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: j26-tags
      $patch: delete
  # Repoint the SecretProviderClass at the prod KV objects.
  - path: secret-provider-class-patch.yaml
    target:
      kind: SecretProviderClass
      name: j26-tags-kv-csi

# Override only the prod-specific ConfigMap values; all other keys are inherited from
# the base ConfigMap unchanged. Merging by name into the existing (non-generated)
# ConfigMap does not add a hash suffix, so the Deployment's envFrom.configMapRef.name
# stays valid.
configMapGenerator:
  - name: j26-tags-config
    behavior: merge
    literals:
      - KEYCLOAK_DISCOVERY_URL=https://app.jamboree.se/auth/.well-known/openid-configuration
