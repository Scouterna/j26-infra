# Prod: pull the database DSN and the machine-API key from the prod KV objects instead
# of the dev ones. The Kubernetes secret name (j26-tags-secrets) is unchanged, so the
# base Deployment's secretRef and secretKeyRef stay valid. Both the secretObjects.data
# objectNames and the parameters.objects array are restated (kustomize replaces these
# blocks); everything else — provider, vault name, tenant, identity — is inherited.
# NOTE: the j26-prod-tags-* objects must exist in kv-j26apps-shared-sdc, and the prod
# database must be provisioned, before sync.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: j26-tags-kv-csi
spec:
  secretObjects:
    - secretName: j26-tags-secrets
      type: Opaque
      data:
        - key: DATABASE_URL
          objectName: j26-prod-tags-postgres-dsn
        - key: TAGS_API_KEY
          objectName: j26-prod-tags-api-key
  parameters:
    objects: |
      array:
        - |
          objectName: j26-prod-tags-postgres-dsn
          objectType: secret
        - |
          objectName: j26-prod-tags-api-key
          objectType: secret
