# Prod route for j26-tags. No StripPrefix — the app keeps its base path (like dev's
# rewrite-target /_services/tags/$2). Reuses the app.jamboree.se TLS secret.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: j26-tags
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`app.jamboree.se`) && (Path(`/_services/tags`) || PathPrefix(`/_services/tags/`))
      services:
        - name: j26-tags
          port: 80
  tls:
    secretName: j26-app-tls-secret
