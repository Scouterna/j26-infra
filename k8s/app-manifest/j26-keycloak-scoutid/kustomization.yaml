apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 15-secret-provider-class.yaml
  - 20-keycloak.yaml
  - 30-ingressroute.yaml
  - 40-config-cli.yaml
  - 45-keycloak-config-configmap.yaml
  - 50-servicemonitor.yaml
  - 55-ensure-master-admin-job.yaml

# Keep dev workloads OFF the prod node pool (userpool) during camp: soft-prefer the
# original 'agentpool' pool so dev can't compete with prod for CPU. Preference only
# (not a hard rule) so pods still schedule if agentpool is full. Strategic-merge so
# an existing/future affinity block (e.g. podAntiAffinity) is preserved, not replaced.
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: agentpool
                          operator: In
                          values:
                            - agentpool
