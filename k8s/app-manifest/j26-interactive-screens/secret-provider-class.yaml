# Materialises the j26-tags machine-API key from Key Vault so this app can mirror
# the tag registry (GET TAGS_API_URL, authenticated with TAGS_API_KEY).
#
# It is deliberately the same KV object the tags app itself reads (j26-tags-api-key):
# the registry authenticates machine clients with one shared static key, so there is
# no per-client key to issue.
#
# Dev has no DATABASE_URL here — it composes one from the Azure Service Connector
# secret (sc-postgresqlfbac0-secret) instead. Prod adds DATABASE_URL to this same
# Kubernetes secret and repoints both objects at the prod KV copies; see
# app-manifest-prod/j26-interactive-screens/secret-provider-class-patch.yaml.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: j26-interactive-screens-kv-csi
spec:
  provider: azure
  secretObjects:
    - secretName: j26-interactive-screens-secrets
      type: Opaque
      data:
        - key: TAGS_API_KEY
          objectName: j26-tags-api-key
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: 214abfc2-fa80-44b9-89c5-f78444a16816
    keyvaultName: kv-j26apps-shared-sdc
    tenantId: 317a47ba-fd32-41b8-8ebe-310a1adc9863
    objects: |
      array:
        - |
          objectName: j26-tags-api-key
          objectType: secret
