apiVersion: apps/v1
kind: Deployment
metadata:
  name: j26-interactive-screens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j26-interactive-screens
  template:
    metadata:
      labels:
        app: j26-interactive-screens
    spec:
      initContainers:
        - name: j26-interactive-screens-init-migrate
          image: ghcr.io/scouterna/j26-interactive-screens-v2:latest
          command: ["node", "packages/server/node_modules/tsx/dist/cli.mjs", "packages/server/src/migrate.ts"]
          envFrom:
            - configMapRef:
                name: j26-interactive-screens-config
            - secretRef:
                name: sc-postgresqlfbac0-secret
          env:
            - name: DATABASE_URL
              value: "postgresql://$(AZURE_POSTGRESQL_USER):$(AZURE_POSTGRESQL_PASSWORD)@$(AZURE_POSTGRESQL_HOST):$(AZURE_POSTGRESQL_PORT)/$(AZURE_POSTGRESQL_DATABASE)?sslmode=require"
          # No CSI mount here: migrations need only the database, which dev takes
          # from the Service Connector secret above. Prod adds the mount, because
          # there DATABASE_URL comes from Key Vault (see the prod overlay).
      containers:
        - name: j26-interactive-screens-app
          image: ghcr.io/scouterna/j26-interactive-screens-v2:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: j26-interactive-screens-config
            - secretRef:
                name: sc-postgresqlfbac0-secret
            # Supplies TAGS_API_KEY (and, in prod, DATABASE_URL).
            - secretRef:
                name: j26-interactive-screens-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://$(AZURE_POSTGRESQL_USER):$(AZURE_POSTGRESQL_PASSWORD)@$(AZURE_POSTGRESQL_HOST):$(AZURE_POSTGRESQL_PORT)/$(AZURE_POSTGRESQL_DATABASE)?sslmode=require"
          # The CSI mount is what makes the Key Vault secret sync.
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: j26-interactive-screens-kv-csi
