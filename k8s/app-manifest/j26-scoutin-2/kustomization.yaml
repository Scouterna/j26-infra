apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - secret-provider-class.yaml

configMapGenerator:
  - name: j26-scoutin-2-config-files
    files:
      - config/stepConfig.yml
      - config/stepConfig.pre-checkin.yml
      - config/dataSourceConfig.yml
# Keep dev workloads OFF the prod node pool (userpool) during camp: soft-prefer the
# original 'agentpool' pool so dev can't compete with prod for CPU. Preference only
# (not a hard rule) so pods still schedule if agentpool is full.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: agentpool
                      operator: In
                      values:
                        - agentpool
