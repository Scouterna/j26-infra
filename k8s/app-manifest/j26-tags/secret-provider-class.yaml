# Materialises the database DSN and the static machine-API key from Key Vault.
#
# Unlike most DB apps here (platsbank, bracelet-checker, booking, ...) this app does
# not use an Azure Service Connector: the DSN is stored whole, the way
# j26-notifications does it. That keeps dev and prod structurally identical and avoids
# a per-app Azure resource whose generated secret name has to be pasted back in here.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: j26-tags-kv-csi
spec:
  provider: azure
  secretObjects:
    - secretName: j26-tags-secrets
      type: Opaque
      data:
        - key: DATABASE_URL
          objectName: j26-tags-postgres-dsn
        - key: TAGS_API_KEY
          objectName: j26-tags-api-key
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: 214abfc2-fa80-44b9-89c5-f78444a16816
    keyvaultName: kv-j26apps-shared-sdc
    tenantId: 317a47ba-fd32-41b8-8ebe-310a1adc9863
    objects: |
      array:
        - |
          objectName: j26-tags-postgres-dsn
          objectType: secret
        - |
          objectName: j26-tags-api-key
          objectType: secret
